version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api-gateway:
    build: ./api-gateway
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
    ports:
      - "3000:3000"
    depends_on:
      - auth-service

  auth-service:
    restart: unless-stopped
    build: ./auth-service
    environment:
      - MONGO_URI=mongodb://mongo:27017/auth
    depends_on:
      - mongo
    ports:
      - "3001:3001"

volumes:
  mongo_data:

networks:
  photo-prestiges:
    driver: bridge
