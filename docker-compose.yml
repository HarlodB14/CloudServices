version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - photo-prestiges

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - TARGET_SERVICE_URL=http://target-service:3002
      - REGISTER_SERVICE_URL=http://register-service:3003
      - JWT_SECRET=mysecretkey
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - target-service
      - register-service
    networks:
      - photo-prestiges

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/auth
      - DB_URL=mongodb://mongo:27017/auth
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongo
    networks:
      - photo-prestiges

  target-service:
    build:
      context: .
      dockerfile: target-service/Dockerfile
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongo:27017/target
      - DB_URL=mongodb://mongo:27017/target
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongo
    networks:
      - photo-prestiges

  register-service:
    build:
      context: .
      dockerfile: register-service/Dockerfile
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo:27017/register
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongo
    networks:
      - photo-prestiges

volumes:
  mongo_data:

networks:
  photo-prestiges:
    driver: bridge
