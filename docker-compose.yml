version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - photo-prestiges

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - TARGET_SERVICE_URL=http://target-service:3002
      - REGISTER_SERVICE_URL=http://register-service:3003
      - SCORE_SERVICE_URL=http://score-service:3004
      - JWT_SECRET=mysecretkey
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - target-service
      - register-service
      - score-service
    networks:
      - photo-prestiges

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/auth
      - DB_URL=mongodb://mongo:27017/auth
      - JWT_SECRET=mysecretkey
      - MAIL_SERVICE_URL=http://mail-service:3005
    depends_on:
      - mongo
      - mail-service
    networks:
      - photo-prestiges

  target-service:
    build:
      context: .
      dockerfile: target-service/Dockerfile
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongo:27017/target
      - DB_URL=mongodb://mongo:27017/target
      - SCORE_SERVICE_URL=http://score-service:3004
      - SCORE_REQUEST_TIMEOUT_MS=8000
      - SCORE_SERVICE_API_KEY=internal-score-key
      - CLOCK_SERVICE_URL=http://clock-service:3006
      - CLOCK_REQUEST_TIMEOUT_MS=7000
      - REGISTER_SERVICE_URL=http://register-service:3003
      - MAIL_SERVICE_URL=http://mail-service:3005
      - MAIL_SERVICE_API_KEY=internal-mail-key
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongo
      - score-service
      - register-service
      - mail-service
    networks:
      - photo-prestiges

  score-service:
    build:
      context: .
      dockerfile: score-service/Dockerfile
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://mongo:27017/score
      - DB_URL=mongodb://mongo:27017/score
      - SCORE_SERVICE_API_KEY=internal-score-key
      - AI_SERVICE=imagga
      - AI_REQUEST_TIMEOUT_MS=5000
      - SIMILARITY_WEIGHT=0.7
      - TIMING_WEIGHT=0.3
    depends_on:
      - mongo
    ports:
      - "3004:3004"
    networks:
      - photo-prestiges

  register-service:
    build:
      context: .
      dockerfile: register-service/Dockerfile
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo:27017/register
      - TARGET_SERVICE_URL=http://target-service:3002
      - MAIL_SERVICE_URL=http://mail-service:3005
      - MAIL_SERVICE_API_KEY=internal-mail-key
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongo
      - mail-service
    networks:
      - photo-prestiges

  mail-service:
    build:
      context: .
      dockerfile: mail-service/Dockerfile
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongo:27017/mail
      - DB_URL=mongodb://mongo:27017/mail
      - TARGET_SERVICE_URL=http://target-service:3002
      - REGISTER_SERVICE_URL=http://register-service:3003
      - MAIL_SERVICE_API_KEY=internal-mail-key
      - MAIL_SERVICE_SYSTEM_USER_ID=mail-service-system
      - MAIL_SERVICE_SYSTEM_USER_EMAIL=mail-service@internal.local
      - MAIL_SERVICE_SYSTEM_USER_NAME=Mail Service System
      - MAIL_SERVICE_SYSTEM_ROLES=admin
      - MAIL_SERVICE_SYSTEM_PERMISSIONS=manage:target_deadline
      - REMINDER_JOB_ENABLED=true
      - REMINDER_JOB_FREQUENCY_MS=300000
      - MIN_REMINDER_GAP_MINUTES=60
    ports:
      - "3005:3005"
    depends_on:
      - mongo
    networks:
      - photo-prestiges

  clock-service:
    build:
      context: .
      dockerfile: clock-service/Dockerfile
    environment:
      - PORT=3006
      - MONGO_URI=mongodb://mongo:27017/clock
      - DB_URL=mongodb://mongo:27017/clock
      - REGISTER_SERVICE_URL=http://register-service:3003
      - TARGET_SERVICE_URL=http://target-service:3002
      - CLOCK_REQUEST_TIMEOUT_MS=7000
      - CLOCK_AUTO_FINALIZE=true
      - CLOCK_SERVICE_SYSTEM_USER_ID=clock-service-system
      - CLOCK_SERVICE_SYSTEM_USER_EMAIL=clock-service@internal.local
      - CLOCK_SERVICE_SYSTEM_USER_NAME=Clock Service System
      - CLOCK_SERVICE_SYSTEM_ROLES=admin
      - CLOCK_SERVICE_SYSTEM_PERMISSIONS=manage:target_deadline
    ports:
      - "3006:3006"
    depends_on:
      - mongo
      - register-service
      - target-service
    networks:
      - photo-prestiges

volumes:
  mongo_data:

networks:
  photo-prestiges:
    driver: bridge
